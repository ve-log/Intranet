<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VE-Log | Seite nicht gefunden</title>
<style>
:root{--rot:#922f2b;--blau:#1d3557;--hintergrund:#f3f4f6;--text:#263238}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--hintergrund);color:var(--text);font-family:Arial,sans-serif}
main{width:100%;max-width:440px;padding:34px;background:#fff;border:1px solid #e8e8e8;border-radius:18px;box-shadow:0 12px 40px rgba(29,53,87,.09);text-align:center}
h1{margin:0 0 10px;color:var(--blau);font-size:48px}
p{margin:0 0 22px;color:#667085;line-height:1.6}
a{display:inline-block;padding:13px 22px;border-radius:9px;background:var(--rot);color:#fff;font-weight:700;text-decoration:none}
a:hover{background:#762522}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Diese Seite gibt es nicht oder sie ist noch in Arbeit.</p>
  <a id="home" href="/">Zur Anmeldung</a>
</main>
<script>
  // Funktioniert auch bei GitHub-Pages-Projektseiten (nutzer.github.io/repo/)
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
    document.getElementById('home').href = base + 'index.html';
    var ic = document.createElement('link'); ic.rel = 'icon'; ic.href = base + 'assets/img/favicon.png'; document.head.appendChild(ic);
  })();
</script>
</body>
</html>
